<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comparatives Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f5f0e8;
      --paper: #fffdf7;
      --ink: #1a1612;
      --muted: #8c8070;
      --border: #ddd5c0;
      --accent: #c0392b;
      --accent2: #2c6e49;
      --accent3: #1d4e8f;
      --tag-short: #2c6e49;
      --tag-long: #1d4e8f;
      --correct: #2c6e49;
      --wrong: #c0392b;
      --highlight: #f7e99e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(180,160,120,0.13) 27px,
          rgba(180,160,120,0.13) 28px
        );
      color: var(--ink);
      font-family: 'Source Sans 3', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 5rem;
    }

    .wrapper { width: 100%; max-width: 640px; }

    header { margin-bottom: 2rem; }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
      border-left: 2px solid var(--accent);
      padding-left: 0.6rem;
      display: inline-block;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    h1 em { font-style: italic; color: var(--accent); }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 300;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .tag {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-weight: 600;
    }

    .tag.tshort { background: rgba(44,110,73,0.12); color: var(--tag-short); }
    .tag.tlong  { background: rgba(29,78,143,0.10); color: var(--tag-long); }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 1.5rem;
    }

    .stat {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0;
      border: 1px solid var(--border);
      background: var(--paper);
    }

    .stat:first-child { border-radius: 6px 0 0 6px; }
    .stat:last-child  { border-radius: 0 6px 6px 0; }
    .stat + .stat { border-left: none; }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      display: block;
    }

    .stat-num.c { color: var(--correct); }
    .stat-num.w { color: var(--wrong); }
    .stat-num.p { color: var(--accent3); }
    .stat-lbl   { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

    .prog-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 1.8rem;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.35s ease;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem 2rem 1.75rem;
      box-shadow: 0 2px 0 var(--border), 0 6px 24px rgba(0,0,0,0.06);
      position: relative;
      animation: cardIn 0.28s ease;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      left: 2.8rem;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(192,57,43,0.18);
      border-radius: 1px;
    }

    .card-inner { padding-left: 1rem; }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }

    .q-num {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .q-prompt {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.5rem;
    }

    .q-context {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 1.6rem;
      font-weight: 300;
    }

    .q-context strong {
      color: var(--ink);
      font-style: normal;
      font-weight: 600;
      background: var(--highlight);
      padding: 0 3px;
      border-radius: 2px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .opt-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      color: var(--ink);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      padding: 0.75rem 0.9rem;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, transform 0.08s;
      text-align: left;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent3);
      background: rgba(29,78,143,0.05);
      transform: translateX(2px);
    }

    .opt-btn.correct {
      border-color: var(--correct);
      background: rgba(44,110,73,0.09);
      color: var(--correct);
      font-weight: 600;
    }

    .opt-btn.wrong {
      border-color: var(--wrong);
      background: rgba(192,57,43,0.08);
      color: var(--wrong);
    }

    .opt-btn:disabled { cursor: default; }

    .divider {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 1.2rem 0;
      display: none;
    }

    .feedback {
      font-size: 0.82rem;
      line-height: 1.6;
      display: none;
      padding: 0.8rem 1rem;
      border-radius: 5px;
      border-left: 3px solid;
    }

    .feedback.show { display: block; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .feedback.fb-ok  { background: rgba(44,110,73,0.07);  border-color: var(--correct); color: #1e4d30; }
    .feedback.fb-err { background: rgba(192,57,43,0.07);  border-color: var(--wrong);   color: #7a1e14; }

    .feedback strong { font-weight: 600; }
    .feedback .rule  { display: block; margin-top: 0.3rem; opacity: 0.8; font-style: italic; font-size: 0.78rem; }

    .next-btn {
      display: none;
      width: 100%;
      margin-top: 1rem;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 5px;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
    }

    .next-btn.show { display: block; animation: fadeIn 0.2s ease; }
    .next-btn:hover { background: #2e2820; transform: translateY(-1px); }
    .next-btn:active { transform: translateY(0); }

    .results {
      display: none;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3rem 2rem;
      box-shadow: 0 2px 0 var(--border), 0 6px 24px rgba(0,0,0,0.06);
      text-align: center;
      animation: cardIn 0.35s ease;
    }

    .results.show { display: block; }

    .results-mark {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .results h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .results-pct {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 900;
      color: var(--ink);
      margin: 0.5rem 0;
    }

    .results-tally {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin: 1rem 0 0.5rem;
    }

    .rt-item { text-align: center; }

    .rt-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      display: block;
    }

    .rt-num.c { color: var(--correct); }
    .rt-num.w { color: var(--wrong); }
    .rt-lbl   { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

    .results-msg {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      margin: 1rem 0 1.8rem;
      font-weight: 300;
    }

    .restart-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 2.5rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.08s;
    }

    .restart-btn:hover { opacity: 0.87; transform: translateY(-1px); }

    @media (max-width: 440px) {
      .options { grid-template-columns: 1fr; }
      .card::before { display: none; }
      .card-inner { padding-left: 0; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <span class="eyebrow">Grammar Quiz · English</span>
    <h1>Compara<em>tives</em></h1>
    <p class="subtitle">Choose the correct comparative form of each adjective.</p>
  </header>

  <div class="legend">
    <span class="tag tshort">Short (1 syl / -er)</span>
    <span class="tag tlong">Long (more + adj)</span>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-num p" id="statQ">1/20</span>
      <span class="stat-lbl">Question</span>
    </div>
    <div class="stat">
      <span class="stat-num c" id="statC">0</span>
      <span class="stat-lbl">Correct</span>
    </div>
    <div class="stat">
      <span class="stat-num w" id="statW">0</span>
      <span class="stat-lbl">Wrong</span>
    </div>
  </div>

  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

  <div class="card" id="qCard">
    <div class="card-inner">
      <div class="q-meta">
        <span class="q-num" id="qNum">01</span>
        <span class="tag" id="qTag"></span>
      </div>
      <p class="q-prompt" id="qPrompt"></p>
      <p class="q-context" id="qContext"></p>
      <div class="options" id="optGrid"></div>
      <hr class="divider" id="divider"/>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">Continue →</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="results-mark" id="rMark"></div>
    <h2 id="rTitle"></h2>
    <div class="results-pct" id="rPct"></div>
    <div class="results-tally">
      <div class="rt-item"><span class="rt-num c" id="rC"></span><span class="rt-lbl">Correct</span></div>
      <div class="rt-item"><span class="rt-num w" id="rW"></span><span class="rt-lbl">Wrong</span></div>
    </div>
    <p class="results-msg" id="rMsg"></p>
    <button class="restart-btn" onclick="restart()">Try again</button>
  </div>

</div>

<script>
// type: 'short' = 1-syllable + -er  |  'long' = more + adjective
const bank = [
  // ── SHORT ──
  {
    type: "short",
    base: "cold",
    correct: "colder",
    options: ["colder", "more cold", "coldder", "colded"],
    context: "January is ___ than December in this city.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "cold → <strong>colder</strong>"
  },
  {
    type: "short",
    base: "warm",
    correct: "warmer",
    options: ["warmer", "more warm", "warmmer", "warmed"],
    context: "Spring is ___ than winter.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "warm → <strong>warmer</strong>"
  },
  {
    type: "short",
    base: "loud",
    correct: "louder",
    options: ["louder", "more loud", "loudder", "loudier"],
    context: "The second band was ___ than the first.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "loud → <strong>louder</strong>"
  },
  {
    type: "short",
    base: "clean",
    correct: "cleaner",
    options: ["cleaner", "more clean", "cleanier", "cleanner"],
    context: "This hotel room is ___ than the last one.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "clean → <strong>cleaner</strong>"
  },
  {
    type: "short",
    base: "dark",
    correct: "darker",
    options: ["darker", "more dark", "darkker", "darkier"],
    context: "The forest was ___ than I expected.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "dark → <strong>darker</strong>"
  },
  {
    type: "short",
    base: "thin",
    correct: "thinner",
    options: ["thinner", "thiner", "more thin", "thinned"],
    context: "This laptop is ___ than my old one.",
    rule: "CVC pattern → double final consonant + <strong>-er</strong>.",
    tip: "thin → <strong>thinner</strong> (double n)"
  },
  {
    type: "short",
    base: "wet",
    correct: "wetter",
    options: ["wetter", "weter", "more wet", "wetted"],
    context: "The second day of the trip was ___ than the first.",
    rule: "CVC pattern → double final consonant + <strong>-er</strong>.",
    tip: "wet → <strong>wetter</strong> (double t)"
  },
  {
    type: "short",
    base: "young",
    correct: "younger",
    options: ["younger", "more young", "youngger", "youngier"],
    context: "My sister is two years ___ than me.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "young → <strong>younger</strong>"
  },
  {
    type: "short",
    base: "strong",
    correct: "stronger",
    options: ["stronger", "more strong", "strongger", "strongier"],
    context: "He became ___ after months of training.",
    rule: "1-syllable adjectives → add <strong>-er</strong>.",
    tip: "strong → <strong>stronger</strong>"
  },
  {
    type: "short",
    base: "sad",
    correct: "sadder",
    options: ["sadder", "sader", "more sad", "sadier"],
    context: "The second movie was even ___ than the first.",
    rule: "CVC pattern → double final consonant + <strong>-er</strong>.",
    tip: "sad → <strong>sadder</strong> (double d)"
  },
  {
    type: "short",
    base: "busy",
    correct: "busier",
    options: ["busier", "more busy", "busyer", "more busier"],
    context: "Monday is always ___ than Friday at work.",
    rule: "Consonant + y → change <strong>y → ier</strong>.",
    tip: "busy → <strong>busier</strong>"
  },
  {
    type: "short",
    base: "early",
    correct: "earlier",
    options: ["earlier", "more early", "earlierer", "early-er"],
    context: "We need to leave ___ tomorrow to catch the train.",
    rule: "Consonant + y → change <strong>y → ier</strong>.",
    tip: "early → <strong>earlier</strong>"
  },
  // ── LONG ──
  {
    type: "long",
    base: "difficult",
    correct: "more difficult",
    options: ["more difficult", "difficulter", "difficultier", "most difficult"],
    context: "The second exam was ___ than the first.",
    rule: "3+ syllable adjectives → use <strong>more</strong> + adjective.",
    tip: "difficult → <strong>more difficult</strong>"
  },
  {
    type: "long",
    base: "dangerous",
    correct: "more dangerous",
    options: ["more dangerous", "dangerouser", "dangerousier", "most dangerous"],
    context: "Driving in the rain is ___ than driving in sunshine.",
    rule: "3+ syllable adjectives → use <strong>more</strong> + adjective.",
    tip: "dangerous → <strong>more dangerous</strong>"
  },
  {
    type: "long",
    base: "patient",
    correct: "more patient",
    options: ["more patient", "patienter", "patientier", "most patient"],
    context: "Teachers need to be ___ than office workers.",
    rule: "2+ syllable adjectives (not ending in -y) → use <strong>more</strong>.",
    tip: "patient → <strong>more patient</strong>"
  },
  {
    type: "long",
    base: "creative",
    correct: "more creative",
    options: ["more creative", "creativer", "creativeier", "most creative"],
    context: "Artists are usually ___ than accountants.",
    rule: "2+ syllable adjectives → use <strong>more</strong> + adjective.",
    tip: "creative → <strong>more creative</strong>"
  },
  {
    type: "long",
    base: "reliable",
    correct: "more reliable",
    options: ["more reliable", "reliabler", "reliableier", "most reliable"],
    context: "This car brand is ___ than the other one.",
    rule: "3+ syllable adjectives → use <strong>more</strong> + adjective.",
    tip: "reliable → <strong>more reliable</strong>"
  },
  {
    type: "long",
    base: "careful",
    correct: "more careful",
    options: ["more careful", "carefull-er", "carefuler", "most careful"],
    context: "You need to be ___ when crossing the street.",
    rule: "2-syllable adjectives ending in -ful → use <strong>more</strong>.",
    tip: "careful → <strong>more careful</strong>"
  },
  {
    type: "long",
    base: "famous",
    correct: "more famous",
    options: ["more famous", "famouser", "famousier", "most famous"],
    context: "That singer became ___ after the show.",
    rule: "2-syllable adjectives ending in -ous → use <strong>more</strong>.",
    tip: "famous → <strong>more famous</strong>"
  },
  {
    type: "long",
    base: "nervous",
    correct: "more nervous",
    options: ["more nervous", "nervouser", "nervousier", "most nervous"],
    context: "I was ___ before the second interview than the first.",
    rule: "2-syllable adjectives ending in -ous → use <strong>more</strong>.",
    tip: "nervous → <strong>more nervous</strong>"
  },
  {
    type: "long",
    base: "useful",
    correct: "more useful",
    options: ["more useful", "usefuler", "usefuller", "most useful"],
    context: "A dictionary is ___ than a thesaurus for beginners.",
    rule: "2-syllable adjectives ending in -ful → use <strong>more</strong>.",
    tip: "useful → <strong>more useful</strong>"
  },
  {
    type: "long",
    base: "polluted",
    correct: "more polluted",
    options: ["more polluted", "polluteder", "pollutedier", "most polluted"],
    context: "The city centre is ___ than the suburbs.",
    rule: "3+ syllable adjectives → use <strong>more</strong> + adjective.",
    tip: "polluted → <strong>more polluted</strong>"
  },
  {
    type: "long",
    base: "organized",
    correct: "more organized",
    options: ["more organized", "organizer", "organizedier", "most organized"],
    context: "She is ___ than her brother at home.",
    rule: "3+ syllable adjectives → use <strong>more</strong> + adjective.",
    tip: "organized → <strong>more organized</strong>"
  }
];

const tagInfo = {
  short: { label: "Short (-er)",   cls: "tshort" },
  long:  { label: "Long (more +)", cls: "tlong"  },
};

let questions = [], idx = 0, correct = 0, wrong = 0, done = false;

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function init() {
  questions = shuffle(bank).slice(0, 20);
  idx = 0; correct = 0; wrong = 0; done = false;
  document.getElementById('statC').textContent = 0;
  document.getElementById('statW').textContent = 0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('qCard').style.display = '';
  render();
}

function render() {
  done = false;
  const q = questions[idx];
  const total = questions.length;

  document.getElementById('statQ').textContent = `${idx + 1}/${total}`;
  document.getElementById('progFill').style.width = (idx / total * 100) + '%';
  document.getElementById('qNum').textContent = String(idx + 1).padStart(2, '0');

  const ti = tagInfo[q.type];
  const tagEl = document.getElementById('qTag');
  tagEl.textContent = ti.label;
  tagEl.className = `tag ${ti.cls}`;

  document.getElementById('qPrompt').textContent =
    `What is the comparative form of "${q.base}"?`;

  const ctx = document.getElementById('qContext');
  ctx.innerHTML = q.context.replace(/_+/, '<strong>___</strong>');

  const grid = document.getElementById('optGrid');
  grid.innerHTML = '';
  shuffle(q.options).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => pick(opt, btn, q);
    grid.appendChild(btn);
  });

  document.getElementById('divider').style.display = 'none';
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
  document.getElementById('nextBtn').className = 'next-btn';
}

function pick(chosen, btn, q) {
  if (done) return;
  done = true;
  const ok = chosen === q.correct;

  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('correct');
  });

  if (!ok) {
    btn.classList.add('wrong');
    wrong++;
    document.getElementById('statW').textContent = wrong;
  } else {
    correct++;
    document.getElementById('statC').textContent = correct;
  }

  document.getElementById('divider').style.display = '';
  const fb = document.getElementById('feedback');
  if (ok) {
    fb.className = 'feedback fb-ok show';
    fb.innerHTML = `✓ Correct! &nbsp;${q.tip}<span class="rule">${q.rule}</span>`;
  } else {
    fb.className = 'feedback fb-err show';
    fb.innerHTML = `✗ The answer is <strong>${q.correct}</strong>.<br>${q.tip}<span class="rule">${q.rule}</span>`;
  }

  const nb = document.getElementById('nextBtn');
  nb.className = 'next-btn show';
  nb.textContent = idx + 1 < questions.length ? 'Continue →' : 'See my results →';
}

document.getElementById('nextBtn').onclick = () => {
  idx++;
  idx < questions.length ? render() : showResults();
};

function showResults() {
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('qCard').style.display = 'none';
  const pct = Math.round(correct / questions.length * 100);
  let mark, title, msg;
  if (pct === 100) { mark = 'A+'; title = 'Outstanding!';   msg = 'Every answer correct. You have mastered comparatives!'; }
  else if (pct >= 80) { mark = 'A'; title = 'Well done!';   msg = 'Strong performance. Review the few you missed and you\'ll be perfect.'; }
  else if (pct >= 60) { mark = 'B'; title = 'Good effort!'; msg = 'You\'re on the right track. Focus on when to use -er vs. more.'; }
  else if (pct >= 40) { mark = 'C'; title = 'Keep going!';  msg = 'Remember: short adjectives take -er, long ones take more.'; }
  else                { mark = 'D'; title = 'More practice!'; msg = 'Study the two main rules and try again — you\'ll improve!'; }

  document.getElementById('rMark').textContent = mark;
  document.getElementById('rTitle').textContent = title;
  document.getElementById('rPct').textContent = pct + '%';
  document.getElementById('rC').textContent = correct;
  document.getElementById('rW').textContent = wrong;
  document.getElementById('rMsg').textContent = msg;
  document.getElementById('results').classList.add('show');
}

function restart() { init(); }
init();
</script>
</body>
</html>
