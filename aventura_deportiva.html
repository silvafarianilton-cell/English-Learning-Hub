<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad ELE - Deportes</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f4f8; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            padding-top: 50px;
            margin: 0; 
            min-height: 100vh;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            width: 100%;
            max-width: 600px; 
            text-align: center; 
        }
        h2 { margin-top: 0; color: #2d3748; margin-bottom: 20px; }
        h3 { font-size: 18px; color: #2d3748; margin-bottom: 20px; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #cbd5e0; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 16px; 
            color: #4a5568; 
            outline: none; 
        }
        input[type="text"]:focus {
            border: 2px solid #000;
        }
        
        button { 
            background: #4299e1; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
        }
        button:hover { background: #3182ce; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        
        .hidden { display: none; }
        
        #timer { 
            font-size: 28px; 
            font-weight: bold; 
            color: #e53e3e; 
            margin: 15px 0; 
        }
        
        .word-bank { 
            display: flex; 
            gap: 12px; 
            justify-content: center; 
            margin: 25px 0; 
            flex-wrap: wrap; 
        }
        .word { 
            background: #e2e8f0; 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-weight: bold; 
            color: #2d3748;
        }
        .word.found { 
            background: #48bb78; 
            color: white; 
        }
        
        .feedback { margin-top: 15px; font-size: 15px; }
        .success { color: #48bb78; }
        .error { color: #e53e3e; }
    </style>
</head>

<div id="pantalla-inicio" class="container">
    <h2>Registro de Equipo</h2>
    <input type="text" id="nombre-equipo" placeholder="Nombre del equipo (ej. Los Leones)">
    <input type="text" id="nombres-alumnos" placeholder="Nombres de los integrantes (3 o 4)">
    <br><br>
    <button onclick="iniciarJuego()">Comenzar Actividad</button>
</div>

<div id="pantalla-juego" class="container hidden">
    <h2 id="equipo-display"></h2>
    <div id="timer">02:00</div>
    <h3 id="historia-curso"></h3>
    
    <div class="word-bank" id="banco-palabras"></div>
    
    <input type="text" id="input-oracion" placeholder="Escribe tu oración aquí...">
    <button id="btn-enviar" onclick="validarOracion()">Enviar Oración</button>
    <div id="feedback" class="feedback"></div>

    <br><br>
    <button id="btn-siguiente" class="hidden" onclick="siguienteActividad()">Siguiente Actividad</button>
</div>
